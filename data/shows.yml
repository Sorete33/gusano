# Catálogo único de recitales.
# Generado por scripts/bootstrap-shows.py + scripts/sync-archive.py.
#
# Consumido por:
#   layouts/partials/webamp.html   (winamp de la home)
#   layouts/music.html             (rocola, inyecta window.shows)
#   layouts/shortcodes/track.html  (players en las páginas de recital)
#
# Por pista:
#   id       slug estable; es la clave en data/show-durations.json
#   src      URL completa (catbox / pixeldrain legacy)
#   mp3      nombre de archivo dentro del item de archive.org;
#           se resuelve con `archive` -> https://archive.org/download/<archive>/<mp3>
#   flac/wav descarga en alta calidad, mismo criterio
#   duration segundos (scripts/get-durations.py lo rellena)
# Si la pista tiene `mp3`, gana sobre `src`.
