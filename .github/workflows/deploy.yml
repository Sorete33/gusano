name: Sync Flyers and Deploy
on:
  push:
    branches:
      - master
  # Fired by worker-flyers.js right after it commits a flyer to
  # Sorete33/audiogusano-flyers. This is what makes an upload appear in ~1
  # minute instead of waiting for the next scheduled run.
  repository_dispatch:
    types:
      - flyer-uploaded
  # Manual runs are how deletions and re-syncs get done now that there is no
  # cron to pick them up.
  workflow_dispatch:
  # Monthly safety net. The dispatch path can fail silently (a dropped Worker
  # request, a GitHub outage) and nothing would ever notice, so keep one cheap
  # catch-all run. Set to a 3-hourly cron if you would rather not think about it.
  schedule:
    - cron: '17 4 1 * *'

# REQUIRED: Gives the bot permission to update your flyers.yml
permissions:
  contents: write

# One deploy at a time. Two bands uploading at once should queue up, not race
# each other into conflicting git pushes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install PyYAML

      - name: Run Flyer Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLYERS_REPO: Sorete33/audiogusano-flyers
          FLYERS_PATH: flyers
          FLYERS_BRANCH: main
        run: python sync_github.py --section flyers

      - name: Run Lanzamientos Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLYERS_REPO: Sorete33/audiogusano-flyers
          FLYERS_BRANCH: main
        run: python sync_github.py --section lanzamientos

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'  # latest OK por decisión del dueño; una actualización de Hugo puede romper el build.
          extended: true

      - name: Build Hugo
        run: |
          # We build FIRST while the new flyer files are present in the local runner
          hugo --minify --gc --cleanDestinationDir --enableGitInfo
          ls -R public/images/gallery || echo "Gallery directory not found!"

      # The deploy action silently drops file types it thinks Neocities will
      # refuse, so a .mp4 in the tree reads as a successful deploy while never
      # reaching the site. Fail here instead -- but only on the free tier.
      # On Supporter the account itself has no type restriction, so the guard
      # downgrades to a report instead of blocking the build.
      - name: Check for files Neocities free tier will drop
        run: python3 scripts/check-neocities-types.py public --supporter

      # v3 is the first version with the `neocities_supporter` input; v1 and v2
      # have no way to bypass the type filter, which is what let the .mp4
      # through on paper but not in practice. v3 also renamed api_token to
      # api_key (the old name still works but is deprecated).
      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          # Supporter removes the upload whitelist on the Neocities side, so the
          # action must be told to stop filtering or it drops every .mp4 and
          # .mp3 before it ever contacts Neocities.
          neocities_supporter: true
          dist_dir: public
          # Delete files on Neocities that are no longer in the build. With this
          # off the deploy only ever adds, so every renamed image or dropped
          # flyer stays on the server forever -- Hugo's processed images get
          # content-hashed names (featured_hu_<hash>.png), so re-editing one
          # leaves the previous copy behind on every single build. That is how
          # the site outgrew its quota.
          #
          # cleanup only runs AFTER the upload succeeds, so it will not fire
          # until the storage problem is resolved.
          cleanup: true
          # Never delete the Winamp skins: layouts/partials/webamp.html points
          # the player at all three. Not strictly needed now that
          # neocities_supporter is on (the type filter that used to drop .wsz
          # is bypassed, so they upload), but cleanup would still remove them
          # if one ever fell out of static/. Cheap insurance, so it stays.
          protected_files: "skins/*.wsz"

      # Commit the changes LAST so the deployment isn't delayed by git operations.
      #
      # NOTE: actions/checkout persists credentials backed by GITHUB_TOKEN, and
      # GitHub deliberately does not fire workflows from GITHUB_TOKEN pushes.
      # That is what stops this commit from re-triggering this workflow forever.
      # If anyone switches the checkout to a PAT, that protection is gone and
      # this workflow will loop -- keep using the default token.
      - name: Commit and Push changes back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add everything that changed (data, static, and potential Hugo config changes)
          # We don't worry about 'public' because we ignored it in Step 1
          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated Sync: Update flyers from GitHub"
            # Use --force-with-lease to avoid conflicts if you happen to push locally at the same time
            git push origin HEAD:master
          else
            echo "No changes detected."
          fi